<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle Background -->
  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#bgGrad)"/>
  <rect x="22" y="22" width="468" height="468" rx="104" fill="none" stroke="#60a5fa" stroke-width="6" opacity="0.6"/>

  <!-- Energy Halo -->
  <circle cx="256" cy="256" r="140" fill="#f59e0b" opacity="0.18" filter="url(#glow)"/>

  <!-- Iconic Lightning Bolt (الصاعقة / رعد) -->
  <path d="M280 45 L160 270 L260 270 L220 470 L360 225 L260 225 Z"
        fill="url(#boltGrad)"
        filter="url(#glow)"
        stroke="#ffffff"
        stroke-width="4"
        stroke-linejoin="round"/>
</svg>
